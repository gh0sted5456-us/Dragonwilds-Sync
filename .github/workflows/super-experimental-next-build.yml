name: RSDW Sync Next Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app-next/**
      - .github/workflows/super-experimental-next-build.yml

permissions:
  contents: write

concurrency:
  group: super-experimental-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build launch-ready Windows app
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-next/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate Node entry points
        shell: powershell
        run: |
          node --check electron\main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check electron\stable-runtime.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check electron\startup-screen.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check electron\runtime-worker.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check electron\preload.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check lib\sync\manifest.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check lib\sync\discovery.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-settings-persistence.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-mod-sync-source.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-rsdw-revamp-contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-launcher-profiles.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-server-forks.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-server-migration.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-client-service.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-client-profile-cache.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-social-mods.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-discord-community.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-world-heartbeat.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-cloud-storage.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-sync-delivery.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-player-cap.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-client-admission.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-profile-saves.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-save-cleaner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-performance-sweep.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-profile-refresh.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-stable-runtime.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-startup.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-ui-flow.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-window-layout.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-save-slots.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-world-repository.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-netinfo.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-cloud-publisher.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-lifecycle-guard.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-direct-discovery.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts\check-portable-update.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Next application
        run: npm run build:next

      - name: Assemble standalone runtime
        run: npm run prepare:standalone

      # Ship one self-extracting portable EXE. Electron runs from the portable
      # target's isolated extraction directory instead of directly beside any
      # Dragonwilds server-side proxy DLLs (version.dll / dwmapi.dll).
      - name: Build isolated portable Windows executable
        run: npx electron-builder --win portable --x64 --publish never

      - name: Verify portable Windows output
        shell: powershell
        run: |
          $artifact = Get-ChildItem -LiteralPath release -Filter 'RSDW-Sync-Super-Experimental-*-portable.exe' | Select-Object -First 1
          if (-not $artifact) { throw 'Portable Windows executable was not produced.' }

          # The downloadable payload must be a single launcher EXE, never an
          # unpacked Electron directory that can sit beside UE4SS proxy DLLs.
          $forbidden = @('version.dll','dwmapi.dll','UE4SS.dll')
          foreach ($name in $forbidden) {
            if (Test-Path -LiteralPath (Join-Path $artifact.DirectoryName $name)) {
              throw "Forbidden sidecar DLL found beside portable executable: $name"
            }
          }

          $hash = Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
          "File=$($artifact.Name)" | Set-Content -LiteralPath release\BUILD-INFO.txt
          "Commit=${{ github.sha }}" | Add-Content -LiteralPath release\BUILD-INFO.txt
          "SHA256=$($hash.Hash)" | Add-Content -LiteralPath release\BUILD-INFO.txt
          "Distribution=Single portable EXE; do not extract an Electron runtime beside the server." | Add-Content -LiteralPath release\BUILD-INFO.txt
          "Launch=Run the portable EXE from any normal folder; it isolates its Electron runtime before startup." | Add-Content -LiteralPath release\BUILD-INFO.txt

      - name: Upload portable test build
        uses: actions/upload-artifact@v4
        with:
          name: RSDW-Sync-Super-Experimental-Portable-Windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app-next/release/RSDW-Sync-Super-Experimental-*-portable.exe
            app-next/release/BUILD-INFO.txt

      # Actions artifacts require a signed-in GitHub session and expire. Publish
      # the same verified EXE as a public prerelease so the desktop app can update
      # itself directly from GitHub without asking users for a token.
      - name: Publish self-update prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = Get-ChildItem -LiteralPath release -Filter 'RSDW-Sync-Super-Experimental-*-portable.exe' | Select-Object -First 1
          if (-not $artifact) { throw 'Portable Windows executable was not produced.' }
          $tag = "super-experimental-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create $tag $artifact.FullName release\BUILD-INFO.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target "${{ github.sha }}" `
            --title "RSDW Sync Super Experimental #${{ github.run_number }}" `
            --notes "Automated portable Windows build for commit ${{ github.sha }}. This prerelease is consumed by the in-app updater." `
            --prerelease

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dragonwilds-Sync-Super-Experimental-Failure-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            app-next/release/builder-debug.yml
            app-next/release/builder-effective-config.yaml
            app-next/.next/trace
