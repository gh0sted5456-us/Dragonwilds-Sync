name: V3 Phase 4 Contract

on:
  workflow_dispatch:
  push:
    branches:
      - codex/webgui-catalog-console-overhaul
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase4-contract:
    name: Phase 4 Contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      DRAGONWILDS_SYNC_APPDATA: ${{ runner.temp }}/dragonwilds-sync-v3-phase4
      DWSYNC_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install contract dependency
        run: python -m pip install "cryptography>=46,<47"
      - name: Verify earlier V3 contracts
        run: |
          node scripts/check_v3_phase1.cjs
          python backend/test_v3_phase1.py
          node scripts/check_v3_phase2.cjs
          python backend/test_v3_phase2.py
          node scripts/check_v3_phase3.cjs
          python backend/test_v3_phase3.py
      - name: Verify Phase 4 source contract
        run: node scripts/check_v3_phase4.cjs
      - name: Verify Phase 4 metadata/publication contract
        run: python backend/test_v3_phase4.py
      - name: Verify Phase 4 renderer syntax
        run: |
          node --check renderer/release-v3-phase4.js
          node --check renderer/release-v3-phase4-safety.js
          node --check renderer/release-v3-phase4-manager.js
      - name: Verify Phase 4 Python syntax
        run: >-
          python -m py_compile
          backend/v3_phase4.py
          backend/v3_phase4_registry.py
          backend/v3_phase4_badges.py
          backend/v3_phase4_web.py
          backend/v3_phase4_host_patch.py
          backend/dragonwilds_service.py
