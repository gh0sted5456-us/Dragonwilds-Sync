name: Verify Public Directory Surfaces

on:
  push:
    branches: [main, testing-branch]
    paths:
      - 'backend/world_directory.py'
      - 'backend/test_cloudflare_directory_publication.py'
      - 'backend/test_world_directory_v3_heartbeat.py'
      - 'renderer/public-server-list.js'
      - 'renderer/public-server-list.css'
      - 'renderer/index.html'
      - 'cloudflare/world-directory/src/public-directory-entry.ts'
      - 'cloudflare/world-directory/src/index.ts'
      - 'cloudflare/world-directory/wrangler.jsonc'
      - '.github/workflows/verify-public-directory-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check browser JavaScript
        run: node --check renderer/public-server-list.js
      - name: Check desktop wiring
        run: |
          grep -q 'public-server-list.css' renderer/index.html
          grep -q 'public-server-list.js' renderer/index.html
          grep -q 'https://\*.workers.dev' renderer/index.html
          grep -q 'Sync Public World Directory' renderer/public-server-list.js
          grep -q 'world.isSync && world.syncBroadcasting' renderer/public-server-list.js
      - name: Check signed launcher directory lifecycle
        run: |
          grep -q 'REGISTRATION_RETENTION_DAYS' cloudflare/world-directory/src/index.ts
          grep -q 'handleDeregister' cloudflare/world-directory/src/index.ts
          grep -q 'world_publishers' cloudflare/world-directory/src/index.ts
          grep -q '"REGISTRATION_RETENTION_DAYS": "30"' cloudflare/world-directory/wrangler.jsonc
          ! grep -q 'scanPublicSourcesIncrementally' cloudflare/world-directory/src/public-directory-entry.ts
      - name: Check launcher-signed publication client
        working-directory: backend
        run: python test_cloudflare_directory_publication.py
      - name: Check V3 directory authorization regressions
        working-directory: backend
        run: python test_world_directory_v3_heartbeat.py
      - name: Type-check Cloudflare entry
        working-directory: cloudflare/world-directory
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
