name: Runtime Worker Phase 2 Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - testing-ground
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  worker-foundation:
    name: Worker Foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      DRAGONWILDS_SYNC_APPDATA: ${{ github.workspace }}/.ci-appdata/runtime-worker-phase2
      DWSYNC_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend contract dependency
        run: python -m pip install "cryptography>=46,<47"
      - name: Verify retained V3 contracts
        run: |
          node scripts/check_v3_phase1.cjs
          python backend/test_v3_phase1.py
          node scripts/check_v3_phase2.cjs
          python backend/test_v3_phase2.py
          node scripts/check_v3_phase3.cjs
          python backend/test_v3_phase3.py
          node scripts/check_v3_phase4.cjs
          python backend/test_v3_phase4.py
      - name: Verify worker foundation source contract
        run: node scripts/check_runtime_worker_phase2.cjs
      - name: Verify worker spawn attach and stop
        run: python backend/test_runtime_worker_phase2.py
      - name: Verify worker Python syntax
        run: >-
          python -m py_compile
          backend/runtime_worker_protocol.py
          backend/runtime_worker.py
          backend/worker_supervisor.py
          backend/dragonwilds_service.py
