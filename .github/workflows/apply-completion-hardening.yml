name: Apply Verified Completion Hardening
on:
  push:
    branches: [overhaul/simple-profile-contract]
    paths: [.github/workflows/apply-completion-hardening.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'gh0sted5456-us/Dragonwilds-Sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply checksum-verified, path-limited source patch
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          payload = ''''''
          # Exact content checksum prevents any transfer/transcription corruption.
          payload = payload.replace('TPLssnSpSp3qq', 'TPLssnSp3qq')
          data = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'fee6d804c7a6630b516a49beaa3f1a86d688b9f153315aa4f01527bd111bd0e5'
          allowed = {'backend/loader_repository.py', 'backend/mod_deployment_cleanup.py', 'backend/server_systems.py', 'backend/shared_save_backup.py', 'backend/test_overhaul_completion.py', 'scripts/run_backend_tests.cjs'}
          paths = {line[6:] for line in data.decode().splitlines() if line.startswith('+++ b/')}
          assert paths == allowed, paths
          patch = pathlib.Path('/tmp/completion.patch')
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-build.txt
      - name: Verify completion and retained migration contracts
        run: |
          python scripts/v3_backend_test_runner.py backend/test_overhaul_completion.py
          python scripts/v3_backend_test_runner.py backend/test_simple_profile_migration.py
          python scripts/v3_backend_test_runner.py backend/test_loader_assignments.py
          python scripts/v3_backend_test_runner.py backend/test_win64_profile_mods.py
          python scripts/v3_backend_test_runner.py backend/test_loader_repository_shared_saves.py
      - name: Commit only verified patch and remove temporary transfer workflow
        run: |
          git rm .github/workflows/apply-completion-hardening.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete transactional recovery, migrated save backups, and client boundaries'
          git push origin HEAD:refs/heads/overhaul/simple-profile-contract
