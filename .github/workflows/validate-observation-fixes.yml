name: Validate RSDW and Runtime Compatibility Fixes

on:
  push:
    branches:
      - integration/experimental-all-changes

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Python build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade -r backend\requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m pip install --upgrade -r backend\requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply guarded source changes
        shell: powershell
        run: |
          python scripts\apply_observation_fixes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify focused compatibility regressions
        shell: powershell
        run: |
          python -m py_compile backend\rsdw_cache.py backend\managed_updates.py backend\server_systems.py backend\test_runtime_cache_compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_runtime_cache_compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_managed_updates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full backend regression matrix
        shell: powershell
        run: |
          $env:DRAGONWILDS_SYNC_PYTHON = (Get-Command python).Source
          node scripts\run_backend_tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify portable EXE
        shell: powershell
        run: |
          $env:DRAGONWILDS_SYNC_PYTHON = (Get-Command python).Source
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          & .\scripts\build_windows.ps1 -ProjectRoot $PWD -LogPath "$PWD\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath '.\release\Dragonwilds Sync.exe' -PathType Leaf)) {
            throw 'Portable EXE was not produced.'
          }

      - name: Commit validated fixes and remove temporary tooling
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_observation_fixes.py .github/workflows/validate-observation-fixes.yml
          git add backend/rsdw_cache.py backend/managed_updates.py backend/server_systems.py backend/test_runtime_cache_compat.py scripts/run_backend_tests.cjs
          if (git diff --cached --quiet) { throw 'Validated fix produced no source changes.' }
          git commit -m 'Make RSDW cache and runtime imports resilient'
          git push origin HEAD:integration/experimental-all-changes

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: observation-fix-failure
          if-no-files-found: warn
          path: |
            build.log
            build-logs/*.log
            test-results/*.md
