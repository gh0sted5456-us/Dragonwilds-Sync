name: Validate Profile Mod Management + Exact Paths

on:
  push:
    branches:
      - revamp/executable-save-paths

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Python build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade -r backend\requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply guarded profile and machine path revamp
        shell: powershell
        run: |
          python -c "from pathlib import Path; p=Path(r'scripts/apply_profile_mod_management_revamp.py'); s=p.read_text(encoding='utf-8'); old='result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'; new='result, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'; assert old in s; p.write_text(s.replace(old,new,1), encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\apply_profile_mod_management_revamp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\update_profile_revamp_contract_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\finalize_profile_revamp_staging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\apply_profile_mod_destination_settings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\update_mod_destination_test_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\preserve_direct_runeschema_destination.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\update_alpha11_renderer_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\update_release1_4_profile_path_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\harden_character_backup_uniqueness.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\apply_executable_save_path_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\finalize_executable_save_path_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\route_character_imports_to_saved_root.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\route_server_publish_to_saved_root.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify focused profile and exact-path contracts
        shell: powershell
        run: |
          python -m py_compile backend\machine_paths.py backend\profile_mod_layout.py backend\profile_mod_destinations.py backend\profile_store.py backend\guided_setup.py backend\local_world.py backend\server_engine.py backend\server_systems.py backend\sync_engine.py backend\cl_authority.py backend\shared_mod_repository.py backend\world_maintenance.py backend\dragonwilds_service.py backend\character_profiles.py backend\save_management.py backend\world_operations.py backend\profile_bundle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_executable_save_paths.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_profile_mod_management_revamp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_profile_mod_destination_settings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_v27_13_runtime_profiles.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_cl_authority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_sync_safety.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_alpha7.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_alpha7_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_alpha11.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_release1_4.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_release1_1_5.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_profile_runtime_paths.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_character_item_regression.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full backend regression matrix
        shell: powershell
        run: |
          $env:DRAGONWILDS_SYNC_PYTHON = (Get-Command python).Source
          node scripts\run_backend_tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify portable EXE
        shell: powershell
        run: |
          $env:DRAGONWILDS_SYNC_PYTHON = (Get-Command python).Source
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          & .\scripts\build_windows.ps1 -ProjectRoot $PWD -LogPath "$PWD\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath '.\release\Dragonwilds Sync.exe' -PathType Leaf)) {
            throw 'Portable EXE was not produced.'
          }

      - name: Commit validated revamp and remove temporary tooling
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_profile_mod_management_revamp.py scripts/update_profile_revamp_contract_tests.py scripts/finalize_profile_revamp_staging.py scripts/apply_profile_mod_destination_settings.py scripts/update_mod_destination_test_contract.py scripts/preserve_direct_runeschema_destination.py scripts/update_alpha11_renderer_contract.py scripts/update_release1_4_profile_path_contract.py scripts/harden_character_backup_uniqueness.py scripts/apply_executable_save_path_contract.py scripts/finalize_executable_save_path_contract.py scripts/route_character_imports_to_saved_root.py scripts/route_server_publish_to_saved_root.py .github/workflows/validate-profile-mod-management-revamp.yml
          git add README_PROFILE_MOD_PATHING.md backend/machine_paths.py backend/profile_mod_layout.py backend/profile_mod_destinations.py backend/profile_store.py backend/guided_setup.py backend/local_world.py backend/server_engine.py backend/server_systems.py backend/sync_engine.py backend/cl_authority.py backend/shared_mod_repository.py backend/world_maintenance.py backend/dragonwilds_service.py backend/character_profiles.py backend/save_management.py backend/world_operations.py backend/profile_bundle.py backend/test_executable_save_paths.py backend/test_profile_mod_management_revamp.py backend/test_profile_mod_destination_settings.py backend/test_v27_13_runtime_profiles.py backend/test_sync_safety.py backend/test_alpha7.py backend/test_alpha7_release.py backend/test_alpha11.py backend/test_release1_4.py backend/test_release1_1_5.py renderer/app-v2.js renderer/release-profile-mod-folders.js scripts/run_backend_tests.cjs
          if (git diff --cached --quiet) { throw 'Validated revamp produced no source changes.' }
          git commit -m 'Revamp profile mods and exact machine paths'
          git push origin HEAD:revamp/executable-save-paths

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: executable-save-path-revamp-failure
          if-no-files-found: warn
          path: |
            build.log
            build-logs/*.log
            test-results/*.md
