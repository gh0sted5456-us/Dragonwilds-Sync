name: Verify canonical ecosystem assets

on:
  push:
    branches: [main]
    paths:
      - 'renderer/assets/platforms/**'
      - 'resources/platform-registry.json'
      - 'resources/world-builder-presets.json'
      - 'website/ecosystem-assets.js'
      - 'website/platform-assets.js'
      - 'website/world-builder.html'
      - 'website/.ECOSYSTEM_LOGO_COMPATIBILITY.md'
      - '.github/workflows/verify-ecosystem-assets.yml'
  pull_request:
    paths:
      - 'renderer/assets/platforms/**'
      - 'resources/platform-registry.json'
      - 'resources/world-builder-presets.json'
      - 'website/ecosystem-assets.js'
      - 'website/platform-assets.js'
      - 'website/world-builder.html'
      - 'website/.ECOSYSTEM_LOGO_COMPATIBILITY.md'
      - '.github/workflows/verify-ecosystem-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact ecosystem assets and registry bindings
        shell: bash
        run: |
          set -euo pipefail
          test -s renderer/assets/platforms/ue4ss.png
          test -s renderer/assets/platforms/runeschema.png

          python3 - <<'PY'
          from pathlib import Path
          import json

          assets = Path('renderer/assets/platforms')
          registry = json.loads(Path('resources/platform-registry.json').read_text(encoding='utf-8'))
          presets = json.loads(Path('resources/world-builder-presets.json').read_text(encoding='utf-8'))

          by_key = {item['key']: item for item in registry['platforms']}
          assert by_key['ue4ss']['asset'] == 'ue4ss.png'
          assert by_key['runeschema']['asset'] == 'runeschema.png'

          families = {item['id']: item for item in presets['modFamilies']}
          assert families['ue4ss']['asset'] == 'ue4ss.png'
          assert families['runeschema']['asset'] == 'runeschema.png'
          assert families['paks']['asset'] == 'paks.svg'

          for filename in ('ue4ss.png', 'runeschema.png'):
              data = (assets / filename).read_bytes()
              assert len(data) > 32, f'{filename} is unexpectedly small'
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{filename} is not PNG'

          import hashlib
          assert hashlib.sha256((assets / 'ue4ss.png').read_bytes()).hexdigest() == '5d85d20b008b32516ee3115318b4aeaba54631f6d254477e60af55101823d98a'
          assert hashlib.sha256((assets / 'runeschema.png').read_bytes()).hexdigest() == '379a7b239490eb8fcc01ff6bafdaf291f09393ab30106658af02bf96c716b105'

          website = Path('website/platform-assets.js').read_text(encoding='utf-8')
          assert 'assets/platforms/ue4ss.png' in website
          assert 'assets/platforms/runeschema.png' in website

          builder = Path('website/ecosystem-assets.js').read_text(encoding='utf-8')
          assert "ue4ss: 'assets/platforms/ue4ss.png'" in builder
          assert "runeschema: 'assets/platforms/runeschema.png'" in builder

          page = Path('website/world-builder.html').read_text(encoding='utf-8')
          assert 'ecosystem-assets.js' in page
          PY
