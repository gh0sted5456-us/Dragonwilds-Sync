name: Apply Validated Profile Finish
on:
  pull_request:
    branches: [experimental]
    paths:
      - '.github/workflows/profile-finish-apply.yml'
      - '.github/finish-patch/**'
permissions:
  contents: write
concurrency:
  group: apply-profile-finish-22
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'gh0sted5456-us/Dragonwilds-Sync' && github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'overhaul/simple-profile-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Apply exact hash-verified locally tested source
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          digest = lambda text: hashlib.sha256(text.encode('utf-8')).hexdigest()
          encoded = ''.join(pathlib.Path(f'.github/finish-patch/{i}.txt').read_text().strip() for i in range(1,5))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'd59ff22950136b7b56718b3668a67c8623997ee8b450f7a3e3da2f18a5d4b0eb', 'Transport hash mismatch'
          raw = lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest() == '684729699219d1e007123b80df0575571f7a77003c16fef7481f51b60a5975e3', 'Patch hash mismatch'
          patch = json.loads(raw)
          assert patch['base'] == 'f1fdb7a43dc43494e2a760f0a4ad14a1d76f97ea'
          assert len(patch['files']) == 24
          planned = []
          for record in patch['files']:
              path = pathlib.Path(record['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'backend','renderer','electron','scripts','README_PROFILE_MOD_PATHING.md'}
              assert not path.is_symlink()
              text = path.read_text(encoding='utf-8') if path.exists() else ''
              if record['before'] is None:
                  assert not path.exists(), f'New file already exists: {path}'
              else:
                  assert digest(text) == record['before'], f'Source moved since local validation: {path}'
              edits = record['edits']
              previous_end = 0
              for start, end, replacement in edits:
                  assert previous_end <= start <= end <= len(text)
                  previous_end = end
              for start, end, replacement in reversed(edits):
                  text = text[:start] + replacement + text[end:]
              assert digest(text) == record['after'], f'Output hash mismatch: {path}'
              planned.append((path, text))
          for path, text in planned:
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('w', encoding='utf-8', newline='') as stream:
                  stream.write(text)
              print(f'VERIFIED {path} {digest(text)}')
          pathlib.Path('/tmp/profile-finish-paths.json').write_text(json.dumps([str(path) for path, _ in planned]))
      - name: Validate syntax, folder UI, rollback and migration
        run: |
          python -m pip install 'psutil>=7,<8' 'Pillow>=11,<13' 'cryptography>=46,<47' 'qrcode>=8,<9'
          python -m compileall -q backend
          node --check renderer/app-v2.js
          node --check renderer/release-navigation.js
          node --check electron/main-v2.cjs
          node scripts/check_renderer_contract.cjs
          node scripts/check_source_ownership.cjs
          export DRAGONWILDS_SYNC_APPDATA="$(mktemp -d)"
          export LOCALAPPDATA="$DRAGONWILDS_SYNC_APPDATA/Local"
          export APPDATA="$DRAGONWILDS_SYNC_APPDATA/Roaming"
          mkdir -p "$LOCALAPPDATA" "$APPDATA"
          PYTHONPATH=backend python -m unittest backend.test_loader_assignments backend.test_simple_profile_migration
          python scripts/v3_backend_test_runner.py backend/test_dedicated_staged_overlay.py
          python scripts/v3_backend_test_runner.py backend/test_mod_deployment_cleanup.py
          python scripts/v3_backend_test_runner.py backend/test_setup_ux_regression.py
          git diff --check
      - name: Commit only validated source to the PR branch, never force
        shell: python
        run: |
          import json, pathlib, subprocess
          run = lambda *args: subprocess.run(args, check=True)
          paths = json.loads(pathlib.Path('/tmp/profile-finish-paths.json').read_text())
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','add','--',*paths)
          run('git','commit','-m','Finish Profile migration, transactional loader assignment and renderer retirement')
          run('git','push','origin','HEAD:refs/heads/overhaul/simple-profile-contract')
          run('git','log','-1','--format=VALIDATED_SOURCE_COMMIT=%H')
