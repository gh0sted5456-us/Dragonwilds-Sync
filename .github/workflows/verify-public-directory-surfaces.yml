name: Verify Public Directory Surfaces

on:
  push:
    branches: [main]
    paths:
      - 'website/servers.html'
      - 'website/public-directory-view.js'
      - 'website/public-directory-view.css'
      - 'website/directory-source.json'
      - 'renderer/public-server-list.js'
      - 'renderer/public-server-list.css'
      - 'renderer/index.html'
      - 'cloudflare/world-directory/src/public-directory-entry.ts'
      - 'cloudflare/world-directory/wrangler.jsonc'
      - '.github/workflows/verify-public-directory-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check browser JavaScript
        run: |
          node --check website/public-directory-view.js
          node --check renderer/public-server-list.js
      - name: Check public descriptor
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('website/directory-source.json','utf8'));if(x.format!=='dragonwilds-sync-public-directory-link'||x.version!==1||!x.worlds_url)process.exit(1)"
      - name: Check website wiring
        run: |
          grep -q 'data-directory-view="placards"' website/servers.html
          grep -q 'data-directory-view="horizontal"' website/servers.html
          grep -q 'rel="dragonwilds-sync-directory"' website/servers.html
          grep -q 'public-directory-view.js' website/servers.html
      - name: Check desktop wiring
        run: |
          grep -q 'public-server-list.css' renderer/index.html
          grep -q 'public-server-list.js' renderer/index.html
          grep -q 'https://\*.workers.dev' renderer/index.html
          grep -q 'Public Server List' renderer/public-server-list.js
      - name: Type-check Cloudflare entry
        working-directory: cloudflare/world-directory
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
