name: Build Linux packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libarchive-tools
      - name: Build AppImage, tar.gz, and Flatpak
        run: bash build-linux.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dragonwilds-Sync-1.4.0-Linux-x64
          path: |
            release-linux/*.AppImage
            release-linux/*.tar.gz
            release-linux/*.flatpak
            build-linux.log
          if-no-files-found: error
