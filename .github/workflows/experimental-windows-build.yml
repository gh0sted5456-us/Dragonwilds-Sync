name: Experimental Windows Build Gate

on:
  workflow_dispatch:
  push:
    branches:
      - experimental

permissions:
  contents: read

jobs:
  windows-build:
    name: DragonConnect contracts + Portable EXE
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify DragonConnect, RSDW, and hybrid delivery contracts
        shell: powershell
        run: |
          python backend\test_dragonlink_contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_release1_4_spawner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend\test_hybrid_external_mod_delivery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check renderer\external-mod-hosting.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check renderer\connect-world-receipt.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify Windows portable package
        shell: powershell
        run: |
          $env:DRAGONWILDS_SYNC_PYTHON = (Get-Command python).Source
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          & .\scripts\build_windows.ps1 -ProjectRoot $PWD -LogPath "$PWD\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath '.\release\Dragonwilds Sync.exe' -PathType Leaf)) {
            throw 'Portable EXE was not produced.'
          }

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: experimental-windows-build-failure
          if-no-files-found: warn
          path: |
            build.log
            build-logs/*.log
            test-results/*.md

      - name: Upload verified portable build
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Dragonwilds-Sync-Experimental-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            build.log
