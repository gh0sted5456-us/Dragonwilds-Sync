name: Apply RC2 Testing Feedback

on:
  push:
    branches:
      - codex/webgui-catalog-console-overhaul
    paths:
      - scripts/apply_rc2_feedback.py
      - .github/workflows/apply-rc2-feedback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip rc2-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: codex/webgui-catalog-console-overhaul
          fetch-depth: 0
      - name: Apply asserted RC2 patches
        run: python3 scripts/apply_rc2_feedback.py
      - name: Validate changed Python and JavaScript syntax
        run: |
          python3 -m py_compile backend/profile_store.py backend/local_world.py backend/directory_host.py backend/server_systems.py backend/dragonwilds_service.py backend/web_release_polish.py backend/test_rc2_feedback.py
          node --check renderer/release-rc2.js
          node --check renderer/release-polish.js
          node --check renderer/release-navigation.js
      - name: Commit RC2 feedback implementation
        run: |
          if git diff --quiet; then
            echo "No RC2 changes were required."
            exit 0
          fi
          git config user.name "Dragonwilds Sync RC Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply RC2 testing feedback [skip rc2-fix]"
          git push origin HEAD:codex/webgui-catalog-console-overhaul
