name: Safety Apply - Fresh Profile Mods Folder

on:
  push:
    branches:
      - fix/profile-mod-folder-open-race

permissions:
  contents: write

concurrency:
  group: fresh-profile-mod-folder-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DWSYNC_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/profile-mod-folder-open-race
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'cryptography>=46,<47' psutil
          npm ci

      - name: Apply narrow folder-opening fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_rescan = '\n'.join([
              '  async function authoritativeRescan(kind, profileId) {',
              "    const visibleButton = document.querySelector(kind === 'server' ? '#refresh-server-inventory' : '#sp-refresh');",
              '    if (visibleButton) {',
              '      visibleButton.click();',
              "      updateNote(kind, 'Rescanning the profile mod folders…');",
              '      return;',
              '    }',
              '',
              '    const response = await bridge.invoke(',
              "      kind === 'server' ? 'server.world.inventory' : 'singleplayer.inventory',",
              "      kind === 'server' ? { id: profileId, rescan: true } : { profile_id: profileId, rescan: true },",
              '    );',
              "    updateNote(kind, reconciliationText(response), 'success');",
              '  }',
          ])
          new_rescan = '\n'.join([
              '  async function authoritativeRescan(kind, profileId, { useVisibleButton = true } = {}) {',
              "    const visibleButton = document.querySelector(kind === 'server' ? '#refresh-server-inventory' : '#sp-refresh');",
              '    if (useVisibleButton && visibleButton) {',
              '      visibleButton.click();',
              "      updateNote(kind, 'Rescanning the profile mod folders…');",
              '      return null;',
              '    }',
              '',
              "    updateNote(kind, 'Rescanning the profile mod folders…');",
              '    const response = await bridge.invoke(',
              "      kind === 'server' ? 'server.world.inventory' : 'singleplayer.inventory',",
              "      kind === 'server' ? { id: profileId, rescan: true } : { profile_id: profileId, rescan: true },",
              '    );',
              "    updateNote(kind, reconciliationText(response), 'success');",
              '    return response;',
              '  }',
          ])
          replace_once('renderer/release-profile-mod-folders.js', old_rescan, new_rescan)
          replace_once(
              'renderer/release-profile-mod-folders.js',
              '      try { await authoritativeRescan(kind, profile.id); } catch (_) {}',
              '      try { await authoritativeRescan(kind, profile.id, { useVisibleButton: false }); } catch (_) {}',
          )

          replace_once(
              'backend/cl_authority.py',
              '        if _inventory_rescan_caller("singleplayer.inventory"):\n            return local_world.scan_inventory(game_dir, live=False, profile_id=profile_id)',
              '        if _inventory_rescan_caller("singleplayer.inventory"):\n            profile_mods_root = local_world._world_cache(profile_id) / "mods"\n            profile_mods_root.mkdir(parents=True, exist_ok=True)\n            return local_world.scan_inventory(game_dir, live=False, profile_id=profile_id)',
          )
          replace_once(
              'backend/cl_authority.py',
              '        if _inventory_rescan_caller("server.world.inventory"):\n            return server_systems.scan_profile_snapshot_units(profile_id)',
              '        if _inventory_rescan_caller("server.world.inventory"):\n            profile_mods_root = Path(server_systems.SERVER_PROFILES_DIR) / str(profile_id) / "mods"\n            profile_mods_root.mkdir(parents=True, exist_ok=True)\n            return server_systems.scan_profile_snapshot_units(profile_id)',
          )

          replace_once(
              'backend/test_v27_13_runtime_profiles.py',
              '    renderer = (ROOT / "renderer/app-v2.js").read_text(encoding="utf-8")\n    overlay = (ROOT / "renderer/release-profile-mod-folders.js").read_text(encoding="utf-8")',
              '    renderer = (ROOT / "renderer/app-v2.js").read_text(encoding="utf-8")\n    overlay = (ROOT / "renderer/release-profile-mod-folders.js").read_text(encoding="utf-8")\n    authority = (ROOT / "backend/cl_authority.py").read_text(encoding="utf-8")',
          )
          replace_once(
              'backend/test_v27_13_runtime_profiles.py',
              '    assert renderer.count(\'id="sp-open-mods-folder"\') == 1\n    assert renderer.count(\'id="server-open-mods-folder"\') == 1',
              '    assert renderer.count(\'id="sp-open-mods-folder"\') == 1\n    assert renderer.count(\'id="server-open-mods-folder"\') == 1\n    pre_open_scan = "await authoritativeRescan(kind, profile.id, { useVisibleButton: false })"\n    assert pre_open_scan in overlay\n    assert overlay.index(pre_open_scan) < overlay.index("const opened = await bridge.openPath(target);")\n    assert authority.count("profile_mods_root.mkdir(parents=True, exist_ok=True)") == 2',
          )

          replace_once(
              'backend/test_service_rpc.py',
              'import os\nimport sys',
              'import os\nimport shutil\nimport sys',
          )
          replace_once(
              'backend/test_service_rpc.py',
              '            # Inactive inventory is read from its own snapshot, never the live World One tree.\n            inv2_inactive = rpc(proc, "server.world.inventory", {"id": second_id}, 7)',
              '            # Explicit Rescan must materialize the canonical profile Mods root before\n            # Explorer is asked to open it, including for a completely fresh World.\n            fresh_profile_mods = server_engine._profile_mods_dir(second_id)\n            shutil.rmtree(fresh_profile_mods, ignore_errors=True)\n            assert not fresh_profile_mods.exists()\n            rpc(proc, "server.world.inventory", {"id": second_id, "rescan": True}, 7)\n            assert fresh_profile_mods.is_dir()\n\n            # Inactive inventory is read from its own snapshot, never the live World One tree.\n            inv2_inactive = rpc(proc, "server.world.inventory", {"id": second_id}, 7)',
          )

          allowed = {
              'backend/cl_authority.py',
              'backend/test_service_rpc.py',
              'backend/test_v27_13_runtime_profiles.py',
              'renderer/release-profile-mod-folders.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Unexpected transformed file set: {sorted(changed)}')
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          node --check renderer/release-profile-mod-folders.js
          python -m py_compile backend/cl_authority.py backend/test_service_rpc.py backend/test_v27_13_runtime_profiles.py
          python backend/test_v27_13_runtime_profiles.py
          python backend/test_service_rpc.py
          git diff --check

      - name: Commit verified application change and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/profile-mod-folder-open-race-apply.yml
          git add backend/cl_authority.py backend/test_service_rpc.py backend/test_v27_13_runtime_profiles.py renderer/release-profile-mod-folders.js
          git diff --cached --check
          git commit -m "Create fresh profile Mods folders before Explorer opens"
          git push origin HEAD:fix/profile-mod-folder-open-race
