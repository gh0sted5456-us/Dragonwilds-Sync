name: Desktop Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - testing-ground
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu-package:
    name: Ubuntu 24.04 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Confirm Node toolchain
        run: |
          node --version
          npm --version
          npm run check:runtime
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify V3 Phase 1-3 contracts
        run: |
          python -m pip install "cryptography>=46,<47"
          node scripts/check_v3_phase1.cjs
          python backend/test_v3_phase1.py
          node scripts/check_v3_phase2.cjs
          python backend/test_v3_phase2.py
          node scripts/check_v3_phase3.cjs
          python backend/test_v3_phase3.py
          node --check cloudflare/dragonwilds-sync-directory/worker.js
      - name: Install headless GUI prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Build Ubuntu package
        run: bash scripts/build_linux.sh
      - name: Smoke-test packaged AppImage
        run: bash scripts/test_packaged_linux.sh
      - name: Upload Ubuntu AppImage
        uses: actions/upload-artifact@v6
        with:
          name: Dragonwilds-Sync-Ubuntu-AppImage
          if-no-files-found: error
          path: |
            release/*Ubuntu*.AppImage
            release/checksums-linux.sha256
            release/package-test-report-linux.txt
            dist-service/DragonwildsSync.Service

  windows-package:
    name: Windows Portable EXE
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Confirm Node toolchain
        shell: powershell
        run: |
          node --version
          npm --version
          npm run check:runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify V3 Phase 1-3 contracts
        shell: powershell
        run: |
          python -m pip install "cryptography>=46,<47"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_v3_phase1.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/test_v3_phase1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_v3_phase2.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/test_v3_phase2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_v3_phase3.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/test_v3_phase3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check cloudflare/dragonwilds-sync-directory/worker.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify portable package
        shell: powershell
        run: |
          $env:DRAGONWILDS_SYNC_PYTHON = (Get-Command python).Source
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          & .\scripts\build_windows.ps1 -ProjectRoot $PWD -LogPath "$PWD\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Dragonwilds-Sync-Windows-Failure-Diagnostics
          if-no-files-found: warn
          path: |
            test-results/*.md
            build.log
            build-logs/*.log
      - name: Create Windows package report and checksums
        shell: powershell
        run: |
          $portable = Get-ChildItem .\release\*.exe | Select-Object -First 1
          if (-not $portable) { throw 'Portable EXE was not produced.' }
          @(
            'Dragonwilds Sync Windows Release Candidate',
            '===========================================',
            "Generated: $([DateTime]::UtcNow.ToString('s'))Z",
            '',
            'PASS  Node 24 LTS runtime gate',
            'PASS  V3 Phase 1 contract',
            'PASS  V3 Phase 2 contract',
            'PASS  V3 Phase 3 contract',
            'PASS  npm run verify (build gate)',
            'PASS  sandboxed Electron preload bridge (build gate)',
            'PASS  Packaged service JSON-RPC stdio (build gate)',
            'PASS  Packaged Ed25519 self-test (build gate)',
            'PASS  Packaged launcher/resource validation (build gate)',
            'NOT RUN  Real Dragonwilds game launch',
            'NOT RUN  Cross-platform Ubuntu-host sync test',
            'NOT RUN  Production Cloudflare V3 route deployment',
            '',
            'Automated package result: READY FOR CLEAN-VM / GAME INTEGRATION TESTING'
          ) | Set-Content .\release\package-test-report-windows.txt -Encoding UTF8
          $hash = Get-FileHash $portable.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($portable.Name)" | Set-Content .\release\checksums-windows.sha256 -Encoding ASCII
      - name: Upload Windows Portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: Dragonwilds-Sync-Windows-Portable
          if-no-files-found: error
          path: |
            release/*.exe
            release/checksums-windows.sha256
            release/package-test-report-windows.txt
            build.log

  package-summary:
    name: Package summary
    needs: [ubuntu-package, windows-package]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Both desktop package jobs passed on the pinned Node 24 LTS toolchain.'
          echo 'V3 Phase 1, Phase 2 and Phase 3 contracts passed on both package platforms.'
          echo 'Production Cloudflare V3 route deployment and real Dragonwilds/cross-platform acceptance remain external gates.'

  publish-github-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu-package, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: Dragonwilds-Sync-*
          path: release-assets
          merge-multiple: true

      - name: Normalize downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            destination="release-assets/$(basename "${asset}")"
            [[ "${asset}" == "${destination}" ]] || cp "${asset}" "${destination}"
          done < <(find release-assets -mindepth 2 -type f -print0)

      - name: Validate official release payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          executables=(release-assets/*.exe)
          appimages=(release-assets/*.AppImage)
          windows_checksums=(release-assets/checksums-windows.sha256)
          linux_checksums=(release-assets/checksums-linux.sha256)
          [[ ${#executables[@]} -eq 1 ]] || { echo "Expected exactly one Windows Portable EXE; found ${#executables[@]}" >&2; exit 1; }
          [[ ${#appimages[@]} -eq 1 ]] || { echo "Expected exactly one Linux AppImage; found ${#appimages[@]}" >&2; exit 1; }
          [[ ${#windows_checksums[@]} -eq 1 ]] || { echo 'Windows checksum is missing.' >&2; exit 1; }
          [[ ${#linux_checksums[@]} -eq 1 ]] || { echo 'Linux checksum is missing.' >&2; exit 1; }
          chmod +x "${appimages[0]}"
          ls -lh release-assets

      - name: Publish EXE and AppImage to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.exe \
            release-assets/*.AppImage \
            release-assets/checksums-*.sha256 \
            release-assets/package-test-report-*.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Dragonwilds Sync ${GITHUB_REF_NAME}"
