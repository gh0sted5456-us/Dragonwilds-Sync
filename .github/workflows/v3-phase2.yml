name: V3 Phase 2 Contract

on:
  workflow_dispatch:
  push:
    branches:
      - testing-ground
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase2-contract:
    name: Phase 2 Contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      DRAGONWILDS_SYNC_APPDATA: ${{ runner.temp }}/dragonwilds-sync-v3-phase2
      DWSYNC_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install contract dependency
        run: python -m pip install "cryptography>=46,<47"
      - name: Verify Phase 1 migration safety
        run: |
          node scripts/check_v3_phase1.cjs
          python backend/test_v3_phase1.py
      - name: Verify V3 Phase 2 repository contract
        run: |
          node scripts/check_v3_phase2.cjs
          node --check cloudflare/dragonwilds-sync-directory/worker.js
      - name: Verify V3 Phase 2 runtime/network contract
        run: python backend/test_v3_phase2.py
