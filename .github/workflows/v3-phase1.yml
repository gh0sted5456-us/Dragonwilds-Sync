name: V3 Phase 1 Contract

on:
  workflow_dispatch:
  push:
    branches:
      - codex/webgui-catalog-console-overhaul
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase1-contract:
    name: Phase 1 Contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      DRAGONWILDS_SYNC_APPDATA: ${{ runner.temp }}/dragonwilds-sync-v3-phase1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Phase 1 Python dependency
        run: python -m pip install cryptography
      - name: Verify V3 Phase 1 repository contract
        run: node scripts/check_v3_phase1.cjs
      - name: Verify V3 Phase 1 migration safety
        run: python backend/test_v3_phase1.py
