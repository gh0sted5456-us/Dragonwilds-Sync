name: Deploy Dragonwilds Sync website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'renderer/assets/application-icon.png'
      - 'renderer/assets/singleplayer-banner.png'
      - 'renderer/assets/world-selection-background.png'
      - 'renderer/assets/flags/**'
      - 'renderer/assets/platforms/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve current Dragonwilds dedicated-server build from Steam
        shell: bash
        run: |
          set -euo pipefail
          STEAM_APP_ID='4019830'
          STEAM_ROOT="$RUNNER_TEMP/steamcmd"
          STEAM_INFO="$RUNNER_TEMP/dragonwilds-server-appinfo.txt"
          STEAM_JSON="$RUNNER_TEMP/server-build.json"

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lib32gcc-s1 ca-certificates
          mkdir -p "$STEAM_ROOT"
          curl --fail --silent --show-error --location --retry 3 \
            'https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz' \
            | tar -xz -C "$STEAM_ROOT"

          set +e
          "$STEAM_ROOT/steamcmd.sh" \
            +login anonymous \
            +app_info_update 1 \
            +app_info_print "$STEAM_APP_ID" \
            +quit >"$STEAM_INFO" 2>&1
          steam_status=$?
          set -e

          python3 - "$STEAM_INFO" "$STEAM_JSON" "$STEAM_APP_ID" "$steam_status" <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          import sys

          info_path, out_path, appid, steam_status = sys.argv[1:]
          text = open(info_path, 'r', encoding='utf-8', errors='replace').read()

          token_re = re.compile(r'"((?:\\.|[^"\\])*)"|([{}])')
          tokens = []
          for match in token_re.finditer(text):
              tokens.append(match.group(1) if match.group(1) is not None else match.group(2))

          def parse_object(index):
              if index >= len(tokens) or tokens[index] != '{':
                  raise ValueError('expected opening brace')
              index += 1
              value = {}
              while index < len(tokens) and tokens[index] != '}':
                  key = tokens[index]
                  index += 1
                  if index >= len(tokens):
                      break
                  if tokens[index] == '{':
                      child, index = parse_object(index)
                      value[key] = child
                  else:
                      value[key] = tokens[index]
                      index += 1
              if index < len(tokens) and tokens[index] == '}':
                  index += 1
              return value, index

          app = None
          for index, token in enumerate(tokens[:-1]):
              if token == appid and tokens[index + 1] == '{':
                  app, _ = parse_object(index + 1)
                  break

          depots = app.get('depots', {}) if isinstance(app, dict) else {}
          branches = depots.get('branches', {}) if isinstance(depots, dict) else {}
          public = branches.get('public', {}) if isinstance(branches, dict) else {}
          buildid = str(public.get('buildid', '') or '').strip()
          timeupdated = str(public.get('timeupdated', '') or '').strip()

          if not buildid.isdigit():
              print('SteamCMD did not return a numeric public-branch BuildID.', file=sys.stderr)
              print(f'SteamCMD exit status: {steam_status}', file=sys.stderr)
              print(text[-5000:], file=sys.stderr)
              raise SystemExit(1)

          payload = {
              'available': True,
              'appid': appid,
              'branch': 'public',
              'buildid': buildid,
              'timeupdated': timeupdated,
              'source': 'SteamCMD app_info_print',
              'checked_at': dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          with open(out_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2)
              handle.write('\n')
          print(f'Dragonwilds dedicated server Steam BuildID: {buildid}')
          PY

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/placards
          cp -R website/. _site/
          cp renderer/assets/application-icon.png _site/assets/application-icon.png
          cp renderer/assets/singleplayer-banner.png _site/assets/hero-banner.png
          cp renderer/assets/world-selection-background.png _site/assets/world-selection-background.png
          cp -R renderer/assets/flags _site/assets/flags
          cp -R renderer/assets/platforms _site/assets/platforms
          cp "$RUNNER_TEMP/server-build.json" _site/assets/server-build.json

          # Use the exact baked placard artwork from the application. The blob SHAs
          # pin the website to the same four PNGs even while Experimental evolves.
          curl --fail --silent --show-error --location --retry 3 \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/498243def697d1832e5ef76b16d0f481c3e971a9' \
            -o _site/assets/placards/1.png
          curl --fail --silent --show-error --location --retry 3 \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/e9b14c092045c501b2c5337956460699c04bd6d5' \
            -o _site/assets/placards/2.png
          curl --fail --silent --show-error --location --retry 3 \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/5a515286435834c673f532c2ae1db012cc22bd1d' \
            -o _site/assets/placards/3.png
          curl --fail --silent --show-error --location --retry 3 \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/63743edf52312e65c75d36826d2fc159ab861870' \
            -o _site/assets/placards/4.png

          # Load the application-parity card renderer first, then its icon/motion
          # enhancements, and finally the Steam server-build authority.
          printf '\n\n/* App placard parity layer */\n' >> _site/styles.css
          cat website/placards.css >> _site/styles.css
          printf '\n\n/* Placard icon + motion enhancements */\n' >> _site/styles.css
          cat website/placard-enhancements.css >> _site/styles.css

          printf '\n\n/* App placard parity layer */\n' >> _site/script.js
          cat website/placards.js >> _site/script.js
          printf '\n\n/* Placard icon enhancements */\n' >> _site/script.js
          cat website/placard-enhancements.js >> _site/script.js
          printf '\n\n/* Steam dedicated-server build authority */\n' >> _site/script.js
          cat website/server-build.js >> _site/script.js

          touch _site/.nojekyll

      - name: Validate assembled JavaScript
        shell: bash
        run: node --check _site/script.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
