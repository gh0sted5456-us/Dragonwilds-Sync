<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragonwilds Sync V3 Changelog</title><style>body{margin:0;background:#0b0f10;color:#eee7d6;font:15px/1.55 Inter,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:32px}.hero{padding:24px;border:1px solid #7d6426;border-radius:18px;background:linear-gradient(135deg,#151b1b,#0d1213)}h1,h2{font-family:Georgia,serif}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:#171d1e;color:#d8bd70;border:1px solid #5b4a20;border-radius:999px;padding:8px 14px;cursor:pointer}.tabs button.active{background:#6f5317;color:white}.release{border:1px solid #2f3a39;border-radius:16px;background:#111718;padding:20px}.release li{margin:8px 0}.meta{color:#8fa09a;font-size:12px;text-transform:uppercase;letter-spacing:.12em}</style></head><body><main class="wrap"><section class="hero"><div class="meta">Dragonwilds Sync</div><h1>V3 Changelog</h1><p>This is the single authoritative V3 changelog. The website and launcher read the same <code>docs/changelog.json</code> record.</p></section><div class="tabs" id="tabs"></div><section class="release" id="release">Loading changelog…</section></main><script>fetch('./changelog.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{const rows=data.releases||[],tabs=document.querySelector('#tabs'),view=document.querySelector('#release');function show(i){[...tabs.children].forEach((b,n)=>b.classList.toggle('active',n===i));const r=rows[i]||{};view.innerHTML='<div class="meta">'+(r.status||'release')+' · '+(r.date||'')+' · Version '+escapeHtml(r.version||'')+'</div><h2>'+escapeHtml(r.title||'V3')+'</h2><ul>'+(r.highlights||[]).map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>'}function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}rows.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.title||r.version;b.onclick=()=>show(i);tabs.appendChild(b)});show(0)}).catch(e=>document.querySelector('#release').textContent='Could not load changelog: '+e.message)</script></body></html>
