name: Revamp Windows Build

on:
  push:
    branches:
      - revamp/executable-save-paths

permissions:
  contents: read

jobs:
  build-revamp:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Python build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade -r backend\requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Node build dependencies
        run: npm ci --include=dev --no-audit --no-fund

      # NOTE: this branch's source is already fully materialized (the older
      # scripts\apply_*.py / update_*.py / finalize_*.py codemods this step used
      # to replay were one-time patches from earlier iterative-development
      # phases; their exact-text anchors no longer match current source now
      # that later commits edited those same files directly). Replaying them
      # here hard-failed this workflow on every push (verified: even
      # scripts\apply_profile_mod_management_revamp.py alone fails with
      # "world maintenance inactive roots: expected exactly one match, found 0"
      # against a clean checkout of this branch). Removed rather than patched
      # individually since the checkout already compiles clean and passes the
      # full backend regression matrix with no codemods applied.

      - name: Compile backend Python sources
        shell: powershell
        run: |
          python -m py_compile (Get-ChildItem -Path backend -Filter *.py -Recurse | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime and bundled data contracts
        run: npm run check:runtime

      - name: Prepare renderer dependencies
        run: npm run prepare:monaco

      - name: Verify renderer and source contracts
        run: npm run test:systems:source

      - name: Verify remote permission hashing
        env:
          DWS_REMOTE_PERMISSION_SCENARIO: test_password_hash_and_world_scoped_permissions
        run: python scripts/v3_backend_test_runner.py backend/test_remote_user_permissions.py

      - name: Verify remote map permission
        env:
          DWS_REMOTE_PERMISSION_SCENARIO: test_payload_honors_map_permission
        run: python scripts/v3_backend_test_runner.py backend/test_remote_user_permissions.py

      - name: Verify remote user lifecycle
        env:
          DWS_REMOTE_PERMISSION_SCENARIO: test_desktop_user_lifecycle_and_permission_assignment
        run: python scripts/v3_backend_test_runner.py backend/test_remote_user_permissions.py

      - name: Verify remote HTTP login
        env:
          DWS_REMOTE_PERMISSION_SCENARIO: test_created_user_logs_in_through_remote_http_api
        run: python scripts/v3_backend_test_runner.py backend/test_remote_user_permissions.py

      - name: Verify service subprocess protocol
        run: python scripts/v3_backend_test_runner.py backend/test_service_subprocess_protocol.py

      - name: Verify worker IPC timeout handling
        run: python scripts/v3_backend_test_runner.py backend/test_worker_ipc_timeout.py

      - name: Verify worker startup observability
        run: python scripts/v3_backend_test_runner.py backend/test_worker_startup_observability.py

      - name: Verify state read durability
        run: python scripts/v3_backend_test_runner.py backend/test_state_read_durability.py

      - name: Run backend regression matrix
        run: npm run test:backend

      - name: Build and verify portable EXE
        shell: powershell
        run: |
          $env:DRAGONWILDS_SYNC_PYTHON = (Get-Command python).Source
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          & .\scripts\build_windows.ps1 -ProjectRoot $PWD -LogPath "$PWD\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath '.\release\Dragonwilds Sync.exe' -PathType Leaf)) {
            throw 'Portable EXE was not produced.'
          }

      - name: Package portable build
        shell: powershell
        run: |
          Compress-Archive -Path '.\release\*' -DestinationPath '.\Dragonwilds-Sync-Revamp-Windows.zip' -Force

      - uses: actions/upload-artifact@v6
        with:
          name: Dragonwilds-Sync-Revamp-Windows
          path: Dragonwilds-Sync-Revamp-Windows.zip
          if-no-files-found: error
