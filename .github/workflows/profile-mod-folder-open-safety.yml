name: Safety Apply - Profile Mods Folder Opening

on:
  push:
    branches:
      - cleanup/manual-import-removal

permissions:
  contents: write

concurrency:
  group: profile-mod-folder-open-safety
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/manual-import-removal
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply narrow profile-folder opening guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "renderer/release-profile-mod-folders.js",
              """  async function authoritativeRescan(kind, profileId) {
            const visibleButton = document.querySelector(kind === 'server' ? '#refresh-server-inventory' : '#sp-refresh');
            if (visibleButton) {
              visibleButton.click();
              updateNote(kind, 'Rescanning the profile mod folders…');
              return;
            }

            const response = await bridge.invoke(
              kind === 'server' ? 'server.world.inventory' : 'singleplayer.inventory',
              kind === 'server' ? { id: profileId, rescan: true } : { profile_id: profileId, rescan: true },
            );
            updateNote(kind, reconciliationText(response), 'success');
          }
          """,
              """  async function authoritativeRescan(kind, profileId, { useVisibleButton = true } = {}) {
            const visibleButton = document.querySelector(kind === 'server' ? '#refresh-server-inventory' : '#sp-refresh');
            if (useVisibleButton && visibleButton) {
              visibleButton.click();
              updateNote(kind, 'Rescanning the profile mod folders…');
              return null;
            }

            updateNote(kind, 'Rescanning the profile mod folders…');
            const response = await bridge.invoke(
              kind === 'server' ? 'server.world.inventory' : 'singleplayer.inventory',
              kind === 'server' ? { id: profileId, rescan: true } : { profile_id: profileId, rescan: true },
            );
            updateNote(kind, reconciliationText(response), 'success');
            return response;
          }
          """,
          )
          replace_once(
              "renderer/release-profile-mod-folders.js",
              "try { await authoritativeRescan(kind, profile.id); } catch (_) {}",
              "try { await authoritativeRescan(kind, profile.id, { useVisibleButton: false }); } catch (_) {}",
          )

          replace_once(
              "backend/cl_authority.py",
              """    def local_inventory_scan(game_dir: str, *, live: bool = False, profile_id: str = local_world.SINGLEPLAYER_ID):
                  if _inventory_rescan_caller("singleplayer.inventory"):
                      return local_world.scan_inventory(game_dir, live=False, profile_id=profile_id)
                  return local_world.scan_inventory(game_dir, live=live, profile_id=profile_id)
          """,
              """    def local_inventory_scan(game_dir: str, *, live: bool = False, profile_id: str = local_world.SINGLEPLAYER_ID):
                  if _inventory_rescan_caller("singleplayer.inventory"):
                      profile_mods_root = local_world._world_cache(profile_id) / "mods"
                      profile_mods_root.mkdir(parents=True, exist_ok=True)
                      return local_world.scan_inventory(game_dir, live=False, profile_id=profile_id)
                  return local_world.scan_inventory(game_dir, live=live, profile_id=profile_id)
          """,
          )
          replace_once(
              "backend/cl_authority.py",
              """    def server_inventory_scan(profile_id: str, game_root: str):
                  if _inventory_rescan_caller("server.world.inventory"):
                      return server_systems.scan_profile_snapshot_units(profile_id)
                  return server_engine_module.scan_mod_units(profile_id, game_root)
          """,
              """    def server_inventory_scan(profile_id: str, game_root: str):
                  if _inventory_rescan_caller("server.world.inventory"):
                      profile_mods_root = Path(server_systems.SERVER_PROFILES_DIR) / str(profile_id) / "mods"
                      profile_mods_root.mkdir(parents=True, exist_ok=True)
                      return server_systems.scan_profile_snapshot_units(profile_id)
                  return server_engine_module.scan_mod_units(profile_id, game_root)
          """,
          )

          replace_once(
              "backend/test_v27_13_runtime_profiles.py",
              """    renderer = (ROOT / "renderer/app-v2.js").read_text(encoding="utf-8")
              overlay = (ROOT / "renderer/release-profile-mod-folders.js").read_text(encoding="utf-8")
          """,
              """    renderer = (ROOT / "renderer/app-v2.js").read_text(encoding="utf-8")
              overlay = (ROOT / "renderer/release-profile-mod-folders.js").read_text(encoding="utf-8")
              authority = (ROOT / "backend/cl_authority.py").read_text(encoding="utf-8")
          """,
          )
          replace_once(
              "backend/test_v27_13_runtime_profiles.py",
              """    assert renderer.count('id="sp-open-mods-folder"') == 1
              assert renderer.count('id="server-open-mods-folder"') == 1
          """,
              """    assert renderer.count('id="sp-open-mods-folder"') == 1
              assert renderer.count('id="server-open-mods-folder"') == 1
              pre_open_scan = "await authoritativeRescan(kind, profile.id, { useVisibleButton: false })"
              assert pre_open_scan in overlay
              assert overlay.index(pre_open_scan) < overlay.index("const opened = await bridge.openPath(target);")
              assert authority.count("profile_mods_root.mkdir(parents=True, exist_ok=True)") == 2
          """,
          )

          allowed = {
              "backend/cl_authority.py",
              "backend/test_v27_13_runtime_profiles.py",
              "renderer/release-profile-mod-folders.js",
          }
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"Unexpected transformed file set: {sorted(changed)}")
          PY

      - name: Verify targeted contracts
        shell: bash
        run: |
          node --check renderer/release-profile-mod-folders.js
          python backend/test_v27_13_runtime_profiles.py
          python backend/test_service_rpc.py
          git diff --check

      - name: Commit verified guard and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/profile-mod-folder-open-safety.yml
          git add backend/cl_authority.py backend/test_v27_13_runtime_profiles.py renderer/release-profile-mod-folders.js
          git diff --cached --check
          git commit -m "Guard fresh profile Mods folder opening"
          git push origin HEAD:cleanup/manual-import-removal
