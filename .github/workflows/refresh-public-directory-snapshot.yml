name: Refresh Public Server Fallback Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [webpage]
    paths:
      - '.github/scripts/build_public_server_snapshot.py'
      - '.github/workflows/refresh-public-directory-snapshot.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: public-directory-fallback-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: webpage

      - name: Build complete public-server fallback snapshot
        run: |
          python3 .github/scripts/build_public_server_snapshot.py website/assets/public-worlds-fallback.json
          python3 - <<'PY'
          import json
          path = 'website/assets/public-worlds-fallback.json'
          data = json.load(open(path, encoding='utf-8'))
          worlds = data.get('worlds') or []
          if not worlds:
              raise SystemExit('Fallback snapshot is empty')
          print(f'Validated fallback snapshot with {len(worlds)} Worlds')
          PY
      - name: Commit refreshed snapshot to webpage
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Generated website data belongs exclusively to the Pages source
          # branch. Never advance main or testing-ground from this automation.
          for attempt in 1 2 3; do
            echo "Website snapshot publish attempt $attempt/3"
            cp website/assets/public-worlds-fallback.json "$RUNNER_TEMP/public-worlds-fallback.json"
            git fetch origin webpage
            git reset --hard origin/webpage
            cp "$RUNNER_TEMP/public-worlds-fallback.json" website/assets/public-worlds-fallback.json

            if git diff --quiet -- website/assets/public-worlds-fallback.json; then
              echo 'Public server fallback snapshot is already current on webpage.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add website/assets/public-worlds-fallback.json
            git commit -m 'Refresh public server fallback snapshot'
            if git push origin HEAD:webpage; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo 'webpage advanced while publishing the snapshot; retrying.' >&2
            sleep $((attempt * 2))
          done

          echo 'Unable to publish snapshot to webpage after three retries.' >&2
          exit 1

      - name: Deploy refreshed snapshot to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref webpage
          echo 'Dispatched pages.yml for the webpage branch.'
