name: Apply RC2 Follow-up Cleanup

on:
  push:
    branches:
      - codex/webgui-catalog-console-overhaul
    paths:
      - scripts/apply_rc2_followup.py
      - .github/workflows/apply-rc2-followup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip rc2-followup]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: codex/webgui-catalog-console-overhaul
          fetch-depth: 0
      - name: Apply RC2 follow-up
        run: python3 scripts/apply_rc2_followup.py
      - name: Validate syntax and focused contracts
        run: |
          python3 -m py_compile backend/dragonwilds_service.py backend/server_systems.py backend/test_rc2_followup.py
          python3 backend/test_rc2_followup.py
          node --check renderer/app.js
          node --check renderer/release-polish.js
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No follow-up changes required."
            exit 0
          fi
          git config user.name "Dragonwilds Sync RC Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish RC2 testing cleanup [skip rc2-followup]"
          git push origin HEAD:codex/webgui-catalog-console-overhaul
