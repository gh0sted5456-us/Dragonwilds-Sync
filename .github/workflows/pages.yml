name: Deploy Dragonwilds Sync website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/scripts/inject_public_servers_html.py'
      - 'resources/world-builder-presets.json'
      - 'resources/platform-registry.json'
      - 'renderer/assets/application-icon.png'
      - 'renderer/assets/singleplayer-banner.png'
      - 'renderer/assets/world-selection-background.png'
      - 'renderer/assets/flags/**'
      - 'renderer/assets/platforms/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve current Dragonwilds dedicated-server build from Steam
        id: steam-build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          STEAM_APP_ID='4019830'
          STEAM_ROOT="$RUNNER_TEMP/steamcmd"
          STEAM_INFO="$RUNNER_TEMP/dragonwilds-server-appinfo.txt"
          STEAM_JSON="$RUNNER_TEMP/server-build.json"

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lib32gcc-s1 ca-certificates
          mkdir -p "$STEAM_ROOT"
          curl --fail --silent --show-error --location --retry 3 \
            'https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz' \
            | tar -xz -C "$STEAM_ROOT"

          "$STEAM_ROOT/steamcmd.sh" \
            +login anonymous \
            +app_info_update 1 \
            +app_info_print "$STEAM_APP_ID" \
            +quit >"$STEAM_INFO" 2>&1

          python3 - "$STEAM_INFO" "$STEAM_JSON" "$STEAM_APP_ID" <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          import sys

          info_path, out_path, appid = sys.argv[1:]
          text = open(info_path, 'r', encoding='utf-8', errors='replace').read()
          token_re = re.compile(r'"((?:\\.|[^"\\])*)"|([{}])')
          tokens = [m.group(1) if m.group(1) is not None else m.group(2) for m in token_re.finditer(text)]

          def parse_object(index):
              if index >= len(tokens) or tokens[index] != '{':
                  raise ValueError('expected opening brace')
              index += 1
              value = {}
              while index < len(tokens) and tokens[index] != '}':
                  key = tokens[index]
                  index += 1
                  if index >= len(tokens):
                      break
                  if tokens[index] == '{':
                      child, index = parse_object(index)
                      value[key] = child
                  else:
                      value[key] = tokens[index]
                      index += 1
              if index < len(tokens) and tokens[index] == '}':
                  index += 1
              return value, index

          app = None
          for index, token in enumerate(tokens[:-1]):
              if token == appid and tokens[index + 1] == '{':
                  app, _ = parse_object(index + 1)
                  break

          depots = app.get('depots', {}) if isinstance(app, dict) else {}
          branches = depots.get('branches', {}) if isinstance(depots, dict) else {}
          public = branches.get('public', {}) if isinstance(branches, dict) else {}
          buildid = str(public.get('buildid', '') or '').strip()
          timeupdated = str(public.get('timeupdated', '') or '').strip()
          if not buildid.isdigit():
              raise SystemExit('SteamCMD did not return a numeric public-branch BuildID')

          payload = {
              'available': True,
              'appid': appid,
              'branch': 'public',
              'buildid': buildid,
              'timeupdated': timeupdated,
              'source': 'SteamCMD app_info_print',
              'checked_at': dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          with open(out_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2)
              handle.write('\n')
          print(f'Dragonwilds dedicated server Steam BuildID: {buildid}')
          PY

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/placards
          cp -R website/. _site/
          cp renderer/assets/application-icon.png _site/assets/application-icon.png
          cp renderer/assets/singleplayer-banner.png _site/assets/hero-banner.png
          cp renderer/assets/world-selection-background.png _site/assets/world-selection-background.png
          cp resources/world-builder-presets.json _site/assets/world-builder-presets.json
          cp resources/platform-registry.json _site/assets/platform-registry.json
          cp -R renderer/assets/flags _site/assets/flags
          cp -R renderer/assets/platforms _site/assets/platforms

          # Bake one ten-server first page directly into servers.html so the
          # directory never begins as a JavaScript-only blank surface. The full
          # live/fallback dataset hydrates afterward and remains paginated.
          test -s _site/assets/public-worlds-fallback.json || { echo 'Public World fallback snapshot missing' >&2; exit 1; }
          python3 .github/scripts/inject_public_servers_html.py _site/assets/public-worlds-fallback.json _site/servers.html
          STATIC_WORLD_COUNT="$(grep -c 'data-static-public-world="1"' _site/servers.html || true)"
          test "$STATIC_WORLD_COUNT" -gt 0 || { echo 'No public Worlds were baked into servers.html' >&2; exit 1; }
          test "$STATIC_WORLD_COUNT" -le 10 || { echo 'Public Server List baked more than ten rows' >&2; exit 1; }
          echo "Baked Public Server List first-page rows: $STATIC_WORLD_COUNT"

          required_platforms=(
            steam.svg
            windows.svg
            xbox.svg
            playstation.svg
            nintendo.svg
            switch2.svg
            epicgames.svg
            discord.svg
            nexusmods.svg
            ue4ss.png
            runeschema.png
            paks.svg
          )
          for asset in "${required_platforms[@]}"; do
            path="_site/assets/platforms/$asset"
            test -s "$path" || { echo "Required baked platform/ecosystem asset missing: $asset" >&2; exit 1; }
            if [[ "$asset" == *.svg ]]; then
              grep -qi '<svg' "$path" || { echo "Required platform/ecosystem asset is not SVG: $asset" >&2; exit 1; }
            fi
          done
          python3 - <<'PY'
          import json
          presets = json.load(open('_site/assets/world-builder-presets.json', encoding='utf-8'))
          assert presets.get('format') == 'dragonwilds-sync-world-builder-presets'
          assert int(presets.get('version') or 0) == 1
          assert {x.get('id') for x in presets.get('rulePresets', [])} >= {'normal','kids','adults','custom'}
          assert {x.get('id') for x in presets.get('modFamilies', [])} >= {'ue4ss','runeschema','paks'}

          platforms = json.load(open('_site/assets/platform-registry.json', encoding='utf-8'))
          assert platforms.get('format') == 'dragonwilds-sync-platform-registry'
          keys = {x.get('key') for x in platforms.get('platforms', [])}
          assert {'steam','windows','xbox','playstation','switch2','epicgames'} <= keys
          PY

          if [ -f "$RUNNER_TEMP/server-build.json" ]; then
            cp "$RUNNER_TEMP/server-build.json" _site/assets/server-build.json
          else
            printf '%s\n' '{"available":false,"appid":"4019830","branch":"public","buildid":"","source":"Steam lookup unavailable during this deploy"}' > _site/assets/server-build.json
          fi

          # Exact project-provided placard artwork shared with the application.
          cp renderer/assets/placards/1.png _site/assets/placards/1.png
          cp renderer/assets/placards/2.png _site/assets/placards/2.png
          cp renderer/assets/placards/3.png _site/assets/placards/3.png
          cp renderer/assets/placards/4.png _site/assets/placards/4.png

          printf '\n\n/* App placard parity layer */\n' >> _site/styles.css
          cat website/placards.css >> _site/styles.css
          printf '\n\n/* Interactive placard Rules / Mods details */\n' >> _site/styles.css
          cat website/placard-detail-popovers.css >> _site/styles.css
          printf '\n\n/* Placard icon + motion enhancements */\n' >> _site/styles.css
          cat website/placard-enhancements.css >> _site/styles.css
          printf '\n\n/* World Builder */\n' >> _site/styles.css
          cat website/home-demo.css >> _site/styles.css
          printf '\n\n/* Flippable release download surface */\n' >> _site/styles.css
          cat website/download-flip.css >> _site/styles.css
          printf '\n\n/* Homepage information hierarchy */\n' >> _site/styles.css
          cat website/top-flow.css >> _site/styles.css

          printf '\n\n/* App placard parity layer */\n' >> _site/script.js
          cat website/placards.js >> _site/script.js
          printf '\n\n/* Placard icon enhancements */\n' >> _site/script.js
          cat website/placard-enhancements.js >> _site/script.js
          printf '\n\n/* Canonical baked platform assets */\n' >> _site/script.js
          cat website/platform-assets.js >> _site/script.js
          printf '\n\n/* Steam dedicated-server build authority */\n' >> _site/script.js
          cat website/server-build.js >> _site/script.js
          # World Builder intentionally remains a dedicated page script. Do not
          # concatenate home-demo.js into the global bundle; world-builder.html
          # loads it explicitly so homepage/directory scripts cannot suppress it.
          printf '\n\n/* Flippable release download surface */\n' >> _site/script.js
          cat website/download-flip.js >> _site/script.js
          printf '\n\n/* Homepage information hierarchy */\n' >> _site/script.js
          cat website/top-flow.js >> _site/script.js

          touch _site/.nojekyll

      - name: Validate website JavaScript
        shell: bash
        run: |
          node --check _site/script.js
          node --check _site/home-demo.js
          node --check _site/world-draft-onboarding.js
          node --check _site/public-directory-fetch-fallback.js
          node --check _site/public-directory-view.js

      - name: Verify Public Server List route
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/servers.html
          test -s _site/assets/public-worlds-fallback.json
          test -s _site/public-directory-pagination.css
          grep -q 'data-static-public-world="1"' _site/servers.html
          grep -q 'data-directory-view="placards"' _site/servers.html
          grep -q 'data-directory-view="horizontal"' _site/servers.html
          grep -q 'data-world-filter="offline-sync"' _site/servers.html
          grep -q 'id="world-pagination"' _site/servers.html
          grep -q 'id="stat-total-sync-starts"' _site/servers.html
          grep -q 'public-directory-fetch-fallback.js?v=public-directory-6' _site/servers.html
          python3 - <<'PY'
          import json
          data=json.load(open('_site/assets/public-worlds-fallback.json',encoding='utf-8'))
          worlds=data.get('worlds') or []
          assert worlds, 'Public World fallback snapshot is empty'
          html=open('_site/servers.html',encoding='utf-8').read()
          baked=html.count('data-static-public-world="1"')
          assert 1 <= baked <= 10, f'Baked first page must contain 1-10 rows, got {baked}'
          assert baked <= len(worlds), f'Baked rows exceed snapshot rows: html={baked}, snapshot={len(worlds)}'
          print(f'Public Server List verified: {baked} baked first-page rows; {len(worlds)} snapshot rows available')
          PY

      - name: Verify World Builder route
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/world-builder.html
          test -s _site/home-demo.js
          grep -q 'id="world-builder-demo"' _site/world-builder.html
          grep -Eq 'src="home-demo\.js(\?[^\"]*)?"' _site/world-builder.html
          grep -q 'href="world-builder.html"' _site/world-builder.html
          grep -q "querySelector('#world-builder-demo')" _site/home-demo.js
          grep -q 'loadPresets().then(init)' _site/home-demo.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
