name: Inspect legacy manual importer

on:
  push:
    branches:
      - cleanup/manual-import-removal
    paths:
      - scripts/inspect_legacy_manual_import.py
      - .github/workflows/manual-import-cleanup-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect importer call graph
        run: python scripts/inspect_legacy_manual_import.py | tee manual-import-report.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: manual-import-report
          path: manual-import-report.txt
          if-no-files-found: error
