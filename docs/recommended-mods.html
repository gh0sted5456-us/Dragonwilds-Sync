<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragonwilds Sync Recommended Mods</title><style>body{margin:0;background:#0b0f10;color:#eee7d6;font:15px/1.45 Inter,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px}.hero{padding:24px;border:1px solid #7d6426;border-radius:18px;background:linear-gradient(135deg,#151b1b,#0d1213)}h1,h2{font-family:Georgia,serif}.filters{display:flex;gap:8px;margin:22px 0}.filters button{background:#171d1e;color:#d8bd70;border:1px solid #5b4a20;border-radius:999px;padding:8px 14px;cursor:pointer}.filters button.active{background:#6f5317;color:white}.mods{display:grid;gap:14px}.card{display:grid;grid-template-columns:150px 1fr auto;min-height:105px;overflow:hidden;border:1px solid #2e3938;border-radius:16px;background:#111718}.art{background:#1b2424 center/cover no-repeat}.copy{padding:14px 16px}.copy small{color:#8fa09a}.tags{display:flex;gap:6px;margin-top:9px}.tag{border:1px solid #53615e;border-radius:999px;padding:3px 8px;font-size:10px}.actions{padding:14px;display:flex;align-items:center}.actions a{color:#fff;text-decoration:none;background:#72571b;border:1px solid #b38b2f;border-radius:10px;padding:9px 12px}@media(max-width:700px){.card{grid-template-columns:92px 1fr}.actions{grid-column:1/-1;padding-top:0}}</style></head><body><main class="wrap"><section class="hero"><div style="font-size:11px;letter-spacing:.12em;color:#bba468">DRAGONWILDS SYNC</div><h1>Recommended Mods</h1><p>This public catalog reads the same JSON feed used by the launcher. CLIENT and SERVER tags determine where each recommendation appears.</p></section><div class="filters"><button data-filter="all" class="active">All</button><button data-filter="client">Client</button><button data-filter="server">Server</button></div><div class="mods" id="mods">Loading recommendations…</div></main><script>let all=[];const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(filter='all'){const rows=all.filter(m=>filter==='all'||(m.targets||[]).map(x=>String(x).toLowerCase()).includes(filter));document.querySelector('#mods').innerHTML=rows.map(m=>'<article class="card"><div class="art" style="background-image:url('+JSON.stringify(m.banner_url||m.icon_url||'').slice(1,-1)+')"></div><div class="copy"><h2>'+esc(m.name)+'</h2><small>'+esc(m.author||'Community author')+' · '+esc(String(m.mod_type||'mod').toUpperCase())+'</small><p>'+esc(m.description||m.change||'Recommended Dragonwilds mod.')+'</p><div class="tags">'+(m.targets||[]).map(t=>'<span class="tag">'+esc(String(t).toUpperCase())+'</span>').join('')+'</div></div><div class="actions"><a href="'+esc(m.page_url||'#')+'" target="_blank" rel="noopener">View Details</a></div></article>').join('')||'<p>No recommendations in this category.</p>'}fetch('../resources/recommended-mods.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{all=d.mods||[];draw()}).catch(e=>document.querySelector('#mods').textContent='Could not load recommendations: '+e.message);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.filter)})</script></body></html>
